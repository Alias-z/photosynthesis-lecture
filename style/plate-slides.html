<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plate Lecture Style</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Spectral:ital,wght@0,300;0,400;1,400&display=swap">
<style>
/* Layout: one slide at a time, fitted to the window. Arrow keys or a swipe change slides; the Contents jumper hides at the left edge. */
:root{
  --ground:#dcded6; --paper:#f2f3ee; --ink:#1f2a3a; --ink2:#3f4a5a; --rule:#bfc6c8;
  --serif:Spectral, Georgia, "Times New Roman", serif; --sans:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
html{background:var(--ground)}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:16px;box-sizing:border-box;overflow:hidden}
.wrap{position:relative;width:100%;height:100%}
.wrap:fullscreen{background:var(--ground)}
.stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;box-shadow:0 0 0 1px rgba(31,42,58,.35),0 18px 40px -24px rgba(31,42,58,.45);background:var(--paper)}
.stage canvas{position:absolute;left:0;top:0;width:1600px;height:900px;display:block}
.ov{position:absolute;inset:0;pointer-events:none;color:var(--ink)}
.ov>*{position:absolute;margin:0}
.ov .hit{pointer-events:auto}
.ov .h1,.ov .h2{font-family:var(--serif);font-weight:300;letter-spacing:-.008em;text-wrap:balance}
.ov .h1{font-size:84px;line-height:1.08}
.ov .h1 i{font-weight:400}
.ov .h2{font-size:68px;line-height:1.08}
.ov .sub{font:italic 400 40px/1.3 var(--serif);color:var(--ink2)}
.ov .fig{font:italic 400 34px/1.25 var(--serif);text-align:center}
.ov .fig span{font:400 30px/1.25 var(--sans);color:var(--ink2);margin-left:12px}
.ov .formula{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.ov .formula b{font:400 62px/1 var(--serif)}
.ov .formula span{font:400 30px/1 var(--sans);color:var(--ink2)}
.ov .cap{font:400 38px/1.33 var(--sans);color:#2c3646}
.ov .pg{font:400 30px/1 var(--sans);color:var(--ink2);font-variant-numeric:tabular-nums}
.ov .seg{display:flex;border:2px solid var(--ink)}
.ov .seg button{font:500 30px/1 var(--sans);color:var(--ink);background:var(--paper);border:0;padding:16px 24px;cursor:pointer}
.ov .seg button+button{border-left:2px solid var(--ink)}
.ov .seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.ov button:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
/* hidden contents jumper: a hover strip on the left edge; the tab slides in only when the pointer reaches it */
.ov .jump{left:0;top:0;width:120px;height:900px}
.ov .jump .tab{position:absolute;left:0;top:400px;display:flex;align-items:center;gap:14px;font:500 30px/1 var(--sans);color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-left:0;padding:18px 24px 18px 20px;cursor:pointer;opacity:0;transform:translateX(-100%);transition:transform .18s ease-out,opacity .18s ease-out}
.ov .jump:hover .tab,.ov .jump:focus-within .tab,.ov .jump.open .tab{opacity:1;transform:none}
.ov .jump .menu{position:absolute;left:0;top:484px;display:flex;flex-direction:column;min-width:760px;background:var(--paper);border:2px solid var(--ink);border-left:0}
.ov .jump .menu button{display:flex;gap:26px;align-items:baseline;font:400 30px/1.2 var(--sans);color:var(--ink);text-align:left;background:transparent;border:0;border-top:1px solid var(--rule);padding:18px 26px;cursor:pointer}
.ov .jump .menu button:first-child{border-top:0}
.ov .jump .menu button span{font-variant-numeric:tabular-nums;color:var(--ink2);min-width:1.2em}
.ov .jump .menu button[aria-current="true"]{background:var(--ink);color:var(--paper)}
.ov .jump .menu button[aria-current="true"] span{color:var(--paper)}
@media (hover:none){.ov .jump .tab{opacity:.9;transform:none}}
@media (prefers-reduced-motion:reduce){.ov .jump .tab{transition:none}}
</style>
</head>
<body>

<div class="wrap" id="wrap">
  <div class="stage" id="stage" role="region" aria-roledescription="slide" aria-live="polite">
    <canvas id="cv" aria-hidden="true"></canvas>
    <div class="ov" id="ov"></div>
  </div>
</div>

<script>
(() => {
'use strict';
const W = 1600, H = 900, INK = '#1f2a3a', INKS = '#3f4a5a', PAPER = '#f2f3ee';
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const wrap = document.getElementById('wrap'), stage = document.getElementById('stage'), cv = document.getElementById('cv'), ov = document.getElementById('ov');
let fontsReady = 0, paused = false, slide = 0, open = false, K = 1, cacheKey = '';
const cache = document.createElement('canvas');

/* ---------- helpers ---------- */
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const lin = v => { v /= 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
const enc = v => { v = Math.max(0, Math.min(1, v)); return 255 * (v <= 0.0031308 ? 12.92 * v : 1.055 * Math.pow(v, 1 / 2.4) - 0.055); };
const KEYS = [[380, '#7a00e6'], [400, '#7a00e6'], [430, '#4b00ff'], [450, '#1f2cff'], [470, '#0070ff'], [490, '#00b8ff'], [500, '#00dcd0'], [520, '#00f060'], [550, '#7cf000'], [570, '#e8f000'], [580, '#ffd000'], [600, '#ff8a00'], [620, '#ff4a00'], [650, '#ff1a00'], [700, '#ee0000'], [780, '#cc0000']]
  .map(([l, h]) => [l, [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16))]);
function spec(nm) {
  if (nm <= KEYS[0][0]) return KEYS[0][1];
  for (let i = 1; i < KEYS.length; i++) if (nm <= KEYS[i][0]) { const [l0, c0] = KEYS[i - 1], [l1, c1] = KEYS[i]; const f = (nm - l0) / (l1 - l0); return c0.map((v, k) => v + (c1[k] - v) * f); }
  return KEYS[KEYS.length - 1][1];
}
const vis = nm => Math.max(0, Math.min(1, (nm - 380) / 45, (750 - nm) / 60));
const mixc = (a, b, f) => a.map((v, i) => v + (b[i] - v) * f);
function circ(c, x, y, r) { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); }
function glow(c, x, y, r, col, a) { const g = c.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, rgba(col, a)); g.addColorStop(1, rgba(col, 0)); c.fillStyle = g; circ(c, x, y, r); c.fill(); }
function txt(c, s, x, y, font, col, align = 'left') { c.font = font; c.fillStyle = col; c.textAlign = align; c.textBaseline = 'alphabetic'; c.fillText(s, x, y); }
const serifI = s => `italic 400 ${s}px Spectral, Georgia, serif`;
const plex = (w, s) => `${w} ${s}px "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif`;
let grainCanvas = null;
function grain(c) {
  if (!grainCanvas) {
    grainCanvas = document.createElement('canvas'); grainCanvas.width = grainCanvas.height = 160;
    const g = grainCanvas.getContext('2d'), id = g.createImageData(160, 160), r = mulberry(7);
    for (let i = 0; i < id.data.length; i += 4) { const v = r(); id.data[i] = id.data[i + 1] = id.data[i + 2] = v < 0.5 ? 20 : 255; id.data[i + 3] = Math.floor(r() * 22); }
    g.putImageData(id, 0, 0);
  }
  return c.createPattern(grainCanvas, 'repeat');
}
function paper(c) { c.fillStyle = PAPER; c.fillRect(0, 0, W, H); c.fillStyle = grain(c); c.fillRect(0, 0, W, H); }
function arrow(c, x0, y0, x1, y1, head, col, w) {
  const a = Math.atan2(y1 - y0, x1 - x0);
  c.strokeStyle = col; c.fillStyle = col; c.lineWidth = w; c.lineCap = 'round';
  c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1 - Math.cos(a) * head * 0.6, y1 - Math.sin(a) * head * 0.6); c.stroke();
  c.beginPath(); c.moveTo(x1, y1); c.lineTo(x1 - Math.cos(a - 0.42) * head, y1 - Math.sin(a - 0.42) * head); c.lineTo(x1 - Math.cos(a + 0.42) * head, y1 - Math.sin(a + 0.42) * head); c.closePath(); c.fill();
}
function leafShape(c, L, Wd) {
  c.beginPath(); c.moveTo(-L / 2, 0);
  c.bezierCurveTo(-L * 0.3, -Wd * 0.95, L * 0.16, -Wd * 0.82, L / 2, 0);
  c.bezierCurveTo(L * 0.16, Wd * 0.82, -L * 0.3, Wd * 0.95, -L / 2, 0); c.closePath();
}
function leafVeins(c, L, Wd, col, w) {
  c.strokeStyle = col; c.lineCap = 'round'; c.lineWidth = w;
  c.beginPath(); c.moveTo(-L / 2, 0); c.quadraticCurveTo(0, -Wd * 0.05, L / 2 - 6, 0); c.stroke();
  c.lineWidth = w * 0.55;

    for (const s of [-1, 1]) { c.beginPath(); c.moveTo(x, -Wd * 0.03); c.quadraticCurveTo(x + L * 0.05, s * reach * 0.5, x + L * 0.12, s * reach); c.stroke(); }
  }
}
function petiole(c, L, Wd, col, w) { c.strokeStyle = col; c.lineWidth = w; c.lineCap = 'round'; c.beginPath(); c.moveTo(-L / 2, 0); c.quadraticCurveTo(-L / 2 - L * 0.08, Wd * 0.04, -L / 2 - L * 0.15, Wd * 0.14); c.stroke(); }
function leafInk(c, x, y, L, Wd, rot) {
  c.save(); c.translate(x, y); c.rotate(rot);
  const r = mulberry(11);
  for (let i = 0; i < 5; i++) {
    c.save(); c.translate((r() - 0.5) * 7, (r() - 0.5) * 7); leafShape(c, L * (0.97 + r() * 0.05), Wd * (0.95 + r() * 0.08));
    c.fillStyle = i < 2 ? 'rgba(118,170,88,0.30)' : 'rgba(64,132,66,0.20)'; c.fill(); c.restore();
  }
  leafShape(c, L, Wd); c.strokeStyle = 'rgba(56,112,58,0.28)'; c.lineWidth = 7; c.stroke();
  c.save(); leafShape(c, L, Wd); c.clip(); leafVeins(c, L, Wd, 'rgba(31,42,58,0.85)', 1.8); c.restore();
  petiole(c, L, Wd, INK, 2.2);
  leafShape(c, L, Wd); c.strokeStyle = INK; c.lineWidth = 2.1; c.stroke();
  c.restore();
}
function inkSun(c, x, y, r) {
  glow(c, x, y, r * 3.2, [255, 250, 232], 0.75);
  c.fillStyle = '#fff6d8'; circ(c, x, y, r); c.fill(); c.strokeStyle = INK; c.lineWidth = 1.5; c.stroke();
  c.lineWidth = 1.3; c.lineCap = 'round';
  for (let i = 0; i < 16; i++) { const a = i * Math.PI / 8, l = i % 2 ? 0.45 : 0.75; c.beginPath(); c.moveTo(x + Math.cos(a) * r * 1.35, y + Math.sin(a) * r * 1.35); c.lineTo(x + Math.cos(a) * r * (1.35 + l), y + Math.sin(a) * r * (1.35 + l)); c.stroke(); }
}
function figSky(c) {
  const r = 196;
  c.save(); circ(c, 0, 0, r); c.clip();
  const g = c.createLinearGradient(0, -r, 0, r);
  [[0, '#5f86c4'], [0.35, '#7fa2d6'], [0.6, '#a6c1e6'], [0.8, '#cfdcee'], [1, '#e6ecf0']].forEach(([o, col]) => g.addColorStop(o, col));
  c.fillStyle = g; c.fillRect(-r, -r, 2 * r, 2 * r); c.fillStyle = grain(c); c.fillRect(-r, -r, 2 * r, 2 * r);
  inkSun(c, -62, -92, 19);
  c.beginPath(); c.moveTo(-r, 122); c.bezierCurveTo(-120, 88, -40, 132, 40, 112); c.bezierCurveTo(110, 96, 160, 120, r, 104); c.lineTo(r, r); c.lineTo(-r, r); c.closePath();
  c.fillStyle = '#c4ccb6'; c.fill(); c.strokeStyle = INK; c.lineWidth = 1.5; c.stroke();
  c.restore(); circ(c, 0, 0, r); c.strokeStyle = INK; c.lineWidth = 2.4; c.stroke();
}
function figLeaf(c) {
  const r = 196;
  c.save(); circ(c, 0, 0, r); c.clip();
  c.fillStyle = '#eef1e8'; c.fillRect(-r, -r, 2 * r, 2 * r);
  for (let i = 0; i < 3; i++) { const sx = -168 + i * 34, sy = -150 - i * 22; arrow(c, sx, sy, sx + 54, sy + 72, 12, INK, 1.5); }
  leafInk(c, 16, 26, 300, 116, -0.55);
  c.restore(); circ(c, 0, 0, r); c.strokeStyle = INK; c.lineWidth = 2.4; c.stroke();
}

/* ---------- slide 1: title ---------- */
function drawTitle(c) {
  paper(c);
  c.strokeStyle = INK; c.lineWidth = 1.6; c.strokeRect(40, 40, W - 80, H - 80); c.lineWidth = 0.8; c.strokeRect(50, 50, W - 100, H - 100);
  c.save(); c.translate(520, 600); c.scale(0.85, 0.85); figSky(c); c.restore();
  c.save(); c.translate(1080, 600); c.scale(0.85, 0.85); figLeaf(c); c.restore();
}

/* ---------- slide 2: figure ---------- */
const PX = nm => 160 + (nm - 300) * 2.56;
const LIGHT = [[35, 80, 230], [42, 150, 58], [222, 54, 30]];
const ROWS = [{ nm: 450, y: 300, name: 'blue', b: 0 }, { nm: 550, y: 392, name: 'green', b: 1 }, { nm: 650, y: 484, name: 'red', b: 2 }];
function strip(c, x0, x1, y, h) {
  const g = c.createLinearGradient(x0, 0, x1, 0);
  for (let nm = 300; nm <= 800; nm += 10) g.addColorStop((nm - 300) / 500, rgba(mixc(mixc(spec(nm), [242, 243, 238], 0.12), [43, 50, 64], 1 - Math.pow(vis(nm), 0.6))));
  c.fillStyle = g; c.fillRect(x0, y, x1 - x0, h); c.fillStyle = grain(c); c.fillRect(x0, y, x1 - x0, h);
  c.strokeStyle = INK; c.lineWidth = 1.4; c.strokeRect(x0, y, x1 - x0, h);
}
function bracket(c, xa, xb, y, name, range) {
  const cx = (xa + xb) / 2;
  c.strokeStyle = INK; c.lineWidth = 1.6;
  c.beginPath(); c.moveTo(xa, y - 12); c.lineTo(xa, y); c.lineTo(xb, y); c.lineTo(xb, y - 12); c.stroke();
  c.font = serifI(34); const w1 = c.measureText(name + '  ').width; c.font = plex(400, 30); const w2 = c.measureText(range).width;
  const sx = cx - (w1 + w2) / 2; txt(c, name + '  ', sx, y + 40, serifI(34), INK); txt(c, range, sx + w1, y + 40, plex(400, 30), INKS);
}
function drawFigureStatic(c) {
  paper(c);
  arrow(c, 104, 500, 104, 286, 14, INK, 1.6);
  c.save(); c.translate(82, 393); c.rotate(-Math.PI / 2); txt(c, 'more energy per photon', 0, -4, serifI(30), INKS, 'center'); c.restore();
  for (const r of ROWS) { const x = PX(r.nm); c.strokeStyle = 'rgba(31,42,58,0.55)'; c.lineWidth = 1.2; c.setLineDash([4, 6]); c.beginPath(); c.moveTo(x, r.y + 22); c.lineTo(x, 598); c.stroke(); c.setLineDash([]); }
  strip(c, PX(300), PX(800), 604, 34);
  for (let nm = 300; nm <= 800; nm += 100) txt(c, nm === 800 ? '800 nm' : String(nm), PX(nm), 676, plex(400, 30), INKS, 'center');
  txt(c, 'ultraviolet', PX(340), 588, serifI(30), INKS, 'center'); txt(c, 'infrared', PX(775), 588, serifI(30), INKS, 'center');
  bracket(c, PX(380), PX(750), 704, 'Visible to us', '380–750 nm');
  bracket(c, PX(400), PX(700), 774, 'PAR, the light plants use', '400–700 nm');
}
function drawFigureDyn(c, t) {
  for (const r of ROWS) {
    const x0 = 160, x1 = PX(r.nm) - 14, k = 2 * Math.PI / (r.nm * 0.11), col = LIGHT[r.b];
    c.beginPath();
    for (let x = x0; x <= x1; x += 2) { const env = Math.min(1, (x - x0) / 140); const y = r.y + 24 * env * Math.sin(k * (x - 70 * t)); x === x0 ? c.moveTo(x, y) : c.lineTo(x, y); }
    c.strokeStyle = rgba(col); c.lineWidth = 3.4; c.lineJoin = 'round'; c.stroke();
    const px = PX(r.nm), E = (1239.84 / r.nm).toFixed(2);
    c.fillStyle = rgba(col); circ(c, px, r.y, 12); c.fill(); c.strokeStyle = INK; c.lineWidth = 2; c.stroke();
    txt(c, `${r.nm} nm`, px + 30, r.y + 12, plex(600, 36), INK); c.font = plex(600, 36); const w = c.measureText(`${r.nm} nm`).width;
    txt(c, `${r.name}, ${E} eV`, px + 30 + w + 14, r.y + 12, serifI(36), INKS);
  }
}

/* ---------- slide 3: live demo ---------- */
const SIM = { x0: 360, x1: 1220, y0: 240, y1: 760, cy: 500, band: 46, v: 300, R: 13 };
const BANDS = [{ nm: 450, tau: 0.8 }, { nm: 550, tau: 0.36 }, { nm: 650, tau: 0.18 }];
const BL = [[59, 108, 255], [108, 240, 90], [255, 74, 46]].map(c => c.map(lin));
const sim = { mols: [], pk: [], fl: [], fs: [0, 0, 0], mode: 'noon', mm: 0, spawn: 0, rng: mulberry(5) };
(function makeMols() {
  const r = mulberry(21);
  for (const set of [0, 1]) for (let i = 0; i < 34; i++) {
    const x = SIM.x0 + 30 + (i + (set ? 0.5 : 0) + (r() - 0.5) * 0.6) * (SIM.x1 - SIM.x0 - 60) / 34;
    sim.mols.push({ x, y: SIM.cy - SIM.band + r() * 2 * SIM.band, a: r() * Math.PI, ph: r() * 6.28, set, hot: 0 });
  }
  for (const [ya, yb] of [[SIM.y0 + 70, SIM.cy - SIM.band - 16], [SIM.cy + SIM.band + 16, SIM.y1 - 34]])
    for (let i = 0; i < 12; i++) for (let j = 0; j < 3; j++)
      sim.mols.push({ x: SIM.x0 + 40 + (i + 0.2 + r() * 0.6) * (SIM.x1 - SIM.x0 - 80) / 12, y: ya + (j + 0.2 + r() * 0.6) * (yb - ya) / 3, a: r() * Math.PI, ph: r() * 6.28, set: 2, hot: 0 });
})();
const expected = (b, mode) => 1 - Math.exp(-BANDS[b].tau * (mode === 'sunset' ? 6 : 1));
function pFor(b) { const n = sim.mode === 'sunset' ? 68 : 34; return 1 - Math.exp(-BANDS[b].tau * (sim.mode === 'sunset' ? 6 : 1) / (n * 0.22)); }
function scatterDir(r) { for (;;) { const th = r() * Math.PI * 2, cs = Math.cos(th); if (Math.abs(cs) > 0.88) continue; if (r() * 2 <= 1 + cs * cs) return [cs, Math.sin(th)]; } }
function step(dt) {
  const r = sim.rng;
  sim.mm += ((sim.mode === 'sunset' ? 1 : 0) - sim.mm) * Math.min(1, dt * 4);
  sim.spawn += dt * 22;
  while (sim.spawn >= 1) { sim.spawn--; sim.pk.push({ x: 178, y: SIM.cy + (r() * 2 - 1) * SIM.band, dx: 1, dy: 0, b: (r() * 3) | 0, s: 0, d: 0 }); }
  for (let b = 0; b < 3; b++) sim.fs[b] += (expected(b, sim.mode) - sim.fs[b]) * Math.min(1, dt * 1.6);
  const P = [pFor(0), pFor(1), pFor(2)], sunset = sim.mode === 'sunset';
  for (const p of sim.pk) {
    const mv = SIM.v * dt, px = p.x; p.x += p.dx * mv; p.y += p.dy * mv;
    if (p.s) { p.d += mv; continue; }
    if (p.x > SIM.x0 && px < SIM.x1) for (const m of sim.mols) {
      if (m.set === 2 || (m.set === 1 && !sunset)) continue;
      if (m.x > px && m.x <= p.x && Math.abs(m.y - p.y) < SIM.R) {
        if (r() < P[p.b]) { const d = scatterDir(r); p.dx = d[0]; p.dy = d[1]; p.s = 1; p.x = m.x; p.y = m.y; m.hot = 1; sim.fl.push({ x: m.x, y: m.y, b: p.b, u: 0 }); }
        break;
      }
    }
  }
  sim.pk = sim.pk.filter(p => p.x > -80 && p.x < (p.s ? W + 80 : 1392) && p.y > -80 && p.y < H + 80 && p.d < 380);
  for (const f of sim.fl) f.u += dt / 0.5; sim.fl = sim.fl.filter(f => f.u < 1);
  for (const m of sim.mols) m.hot = Math.max(0, m.hot - dt * 2.5);
}
function mixColor(w) { let R = 0, G = 0, B = 0; for (let i = 0; i < 3; i++) { R += w[i] * BL[i][0]; G += w[i] * BL[i][1]; B += w[i] * BL[i][2]; } const m = Math.max(R, G, B, 1e-6); return [enc(R / m), enc(G / m), enc(B / m)]; }
function lab2(c, x, y, a, b) { txt(c, a, x, y + 8, serifI(36), INK, 'center'); txt(c, b, x, y + 44, plex(400, 30), INKS, 'center'); }
function drawDemoStatic(c) {
  paper(c);
  const { x0, x1, y0, y1 } = SIM;
  c.strokeStyle = INK; c.lineWidth = 1.3; c.strokeRect(x0, y0, x1 - x0, y1 - y0);
  c.lineWidth = 1.6; for (const [x, y, sx, sy] of [[x0, y0, 1, 1], [x1, y0, -1, 1], [x0, y1, 1, -1], [x1, y1, -1, -1]]) { c.beginPath(); c.moveTo(x - sx * 14, y); c.lineTo(x + sx * 18, y); c.moveTo(x, y - sy * 14); c.lineTo(x, y + sy * 18); c.stroke(); }
  txt(c, 'Air molecules, greatly magnified', x0 + 24, y0 + 46, serifI(34), INK);
  inkSun(c, 140, SIM.cy, 30); txt(c, 'Sunlight', 140, SIM.cy + 104, serifI(36), INK, 'center'); txt(c, 'all colours', 140, SIM.cy + 140, plex(400, 30), INKS, 'center');
  lab2(c, 1430, 370, 'Scattered sideways', 'the sky’s colour');
  lab2(c, 1430, 590, 'Gets through', 'the Sun’s colour');
}
function molecule(c, m, t, a) {
  const x = m.x + 1.3 * Math.sin(t * 2 + m.ph), y = m.y + 1.3 * Math.cos(t * 1.7 + m.ph), an = m.a + 0.18 * Math.sin(t * 0.8 + m.ph);
  const dx = Math.cos(an) * 8, dy = Math.sin(an) * 8;
  c.globalAlpha = a; c.strokeStyle = INK; c.lineWidth = 1.8; c.beginPath(); c.moveTo(x - dx, y - dy); c.lineTo(x + dx, y + dy); c.stroke();
  c.fillStyle = m.hot > 0 ? '#fffbe6' : '#f7f8f4'; for (const s of [-1, 1]) { circ(c, x + s * dx, y + s * dy, 7.2); c.fill(); c.stroke(); }
  c.globalAlpha = 1;
}
function packet(c, p) {
  let a = p.s ? Math.max(0, 1 - p.d / 380) : 1;
  if (p.x < 210) a *= Math.max(0, (p.x - 178) / 32);
  if (!p.s && p.x > 1300) a *= Math.max(0, (1392 - p.x) / 92);
  if (a <= 0.01) return;
  const lam = BANDS[p.b].nm * 0.065, L = 50, A = 4.8;
  c.save(); c.translate(p.x, p.y); c.rotate(Math.atan2(p.dy, p.dx));
  c.beginPath(); for (let i = 0; i <= 14; i++) { const x = -L + L * i / 14, y = A * Math.sin(Math.PI * i / 14) * Math.sin(2 * Math.PI * x / lam); i ? c.lineTo(x, y) : c.moveTo(x, y); }
  c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = rgba(LIGHT[p.b], 0.95 * a); c.lineWidth = 3.2; c.stroke(); c.restore();
}
function drawDemoDyn(c, t) {
  const scol = mixColor(sim.fs), tcol = mixColor(sim.fs.map(f => 1 - f)), amt = Math.min(1, (sim.fs[0] + sim.fs[1] + sim.fs[2]) / 2), { x0, x1, y0, y1 } = SIM;
  c.fillStyle = rgba(scol, 0.18 * amt); c.fillRect(x0, y0, x1 - x0, y1 - y0);
  for (const m of sim.mols) { const a = m.set === 1 ? sim.mm : 1; if (a > 0.02) molecule(c, m, t, a); }
  for (const f of sim.fl) { c.strokeStyle = rgba(LIGHT[f.b], 0.85 * (1 - f.u)); c.lineWidth = 1.8; circ(c, f.x, f.y, 9 + 22 * f.u); c.stroke(); }
  for (const p of sim.pk) packet(c, p);
  c.fillStyle = rgba(scol); c.fillRect(1340, 240, 180, 96); c.fillStyle = grain(c); c.fillRect(1340, 240, 180, 96); c.strokeStyle = INK; c.lineWidth = 1.5; c.strokeRect(1340, 240, 180, 96);
  c.fillStyle = rgba(tcol); circ(c, 1430, SIM.cy, 46); c.fill(); c.strokeStyle = INK; c.lineWidth = 1.6; c.stroke();
}
const CAP = {
  noon: 'Midday: a short path through air. Blue scatters sideways most, so the sky is blue and the Sun looks white.',
  sunset: 'Sunset: a much longer path. Blue and green scatter away, so the light that reaches you is orange-red.',
};

/* ---------- slide text and the hidden jumper ---------- */
const PAGES = ['Why is the sky blue?', 'Light is a mix of wavelengths', 'Air scatters blue light most'];
function overlay() {
  let h = '';
  if (slide === 0) h = `<h1 class="h1" style="left:106px;top:104px;width:1390px">Why is the sky <i>blue</i>,<br>and why are leaves <i>green</i>?</h1>
      <p class="sub" style="left:110px;top:296px;width:1300px">Two everyday colours, one story about light.</p>
      <p class="fig" style="left:220px;top:788px;width:600px">Fig. 1<span>The noon sky</span></p>
      <p class="fig" style="left:780px;top:788px;width:600px">Fig. 2<span>A leaf in sunlight</span></p>`;
  else if (slide === 1) h = `<h2 class="h2" style="left:92px;top:50px;width:960px">Light is a mix of wavelengths.</h2>
      <p class="sub" style="left:96px;top:134px;width:1000px">Shorter waves carry more energy in each photon.</p>
      <div class="formula" style="left:1050px;top:52px;width:454px"><b><i>E</i> = <i>hc</i> / <i>λ</i></b><span>≈ 1240 eV·nm ÷ λ</span></div>
      <p class="fig" style="left:96px;top:836px;width:1400px;text-align:left">Fig. 3<span>Each wave is drawn to scale.</span></p>`;
  else h = `<h2 class="h2" style="left:92px;top:48px;width:960px">Air scatters blue light most</h2>
      <div class="seg hit" style="right:96px;top:56px" role="group" aria-label="Animation controls">
        <button id="m-noon" type="button" data-mode="noon" aria-pressed="${sim.mode === 'noon'}">Midday</button>
        <button id="m-sunset" type="button" data-mode="sunset" aria-pressed="${sim.mode === 'sunset'}">Sunset</button>
        <button id="m-pause" type="button" data-act="pause" aria-pressed="${paused}">${paused ? 'Play' : 'Pause'}</button>
      </div>
      <p class="cap" style="left:96px;top:778px;width:1230px">${CAP[sim.mode]}</p>`;
  h += `<p class="pg" style="right:96px;top:800px">${slide + 1} / ${PAGES.length}</p>`;
  h += `<div class="jump hit${open ? ' open' : ''}">
      <button class="tab" type="button" data-toc="1" aria-expanded="${open ? 'true' : 'false'}"><svg width="26" height="20" viewBox="0 0 26 20" aria-hidden="true"><path d="M2 3H24M2 10H24M2 17H24" stroke="currentColor" stroke-width="2.6"/></svg>Contents</button>
      ${open ? `<div class="menu" role="menu">${PAGES.map((t, i) => `<button type="button" role="menuitem" data-go="${i}" aria-current="${i === slide}"><span>${i + 1}</span>${t}</button>`).join('')}</div>` : ''}
    </div>`;
  ov.innerHTML = h;
  stage.setAttribute('aria-label', `Slide ${slide + 1} of ${PAGES.length}: ${PAGES[slide]}`);
}
function go(i) { slide = Math.max(0, Math.min(PAGES.length - 1, i)); open = false; cacheKey = ''; overlay(); try { history.replaceState(null, '', '#' + (slide + 1)); } catch (e) {} }

/* ---------- sizing and loop ---------- */
function fit() {
  const w = wrap.clientWidth, h = wrap.clientHeight, s = Math.min(w / W, h / H);
  stage.style.transform = `translate(${(w - W * s) / 2}px,${(h - H * s) / 2}px) scale(${s})`;
  K = s * Math.min(2, window.devicePixelRatio || 1);
  const bw = Math.max(1, Math.round(W * K)), bh = Math.max(1, Math.round(H * K));
  if (cv.width !== bw || cv.height !== bh) { cv.width = bw; cv.height = bh; }
  cacheKey = '';
}
let T1 = 0, T2 = 0, last = performance.now();
const ctx = cv.getContext('2d');
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  if (!RM) T1 += dt;
  if (!paused) { step(dt); T2 += dt; }
  const key = slide + ':' + cv.width + 'x' + cv.height + ':' + fontsReady;
  if (key !== cacheKey) {
    cache.width = cv.width; cache.height = cv.height;
    const c = cache.getContext('2d'); c.setTransform(K, 0, 0, K, 0, 0);
    if (slide === 0) drawTitle(c); else if (slide === 1) drawFigureStatic(c); else drawDemoStatic(c);
    cacheKey = key;
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height); ctx.drawImage(cache, 0, 0);
  ctx.setTransform(K, 0, 0, K, 0, 0);
  if (slide === 1) drawFigureDyn(ctx, T1); else if (slide === 2) drawDemoDyn(ctx, T2);
  requestAnimationFrame(frame);
}

/* ---------- input ---------- */
ov.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  e.stopPropagation();
  if (b.dataset.toc) { open = !open; overlay(); const t = ov.querySelector(open ? '.menu button[aria-current="true"]' : '.tab'); if (t) t.focus(); return; }
  if (b.dataset.go !== undefined) { go(+b.dataset.go); return; }
  if (b.dataset.mode) sim.mode = b.dataset.mode; else if (b.dataset.act === 'pause') paused = !paused;
  overlay(); const again = document.getElementById(b.id); if (again) again.focus();
});
document.addEventListener('click', () => { if (open) { open = false; overlay(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { go(slide + 1); e.preventDefault(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { go(slide - 1); e.preventDefault(); }
  else if (e.key === 'Home') go(0);
  else if (e.key === 'End') go(PAGES.length - 1);
  else if (e.key === 'Escape' && open) { open = false; overlay(); }
  else if ((e.key === 'f' || e.key === 'F') && !e.metaKey && !e.ctrlKey) {
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    else if (wrap.requestFullscreen) wrap.requestFullscreen().catch(() => {});
  }
});
let tx = null;
wrap.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
wrap.addEventListener('touchend', e => { if (tx === null) return; const d = e.changedTouches[0].clientX - tx; if (Math.abs(d) > 50) go(slide + (d < 0 ? 1 : -1)); tx = null; });
new ResizeObserver(fit).observe(wrap);
document.addEventListener('fullscreenchange', fit);

/* ---------- boot ---------- */
const hm = /^#([123])$/.exec(location.hash); if (hm) slide = +hm[1] - 1;
for (let b = 0; b < 3; b++) sim.fs[b] = expected(b, sim.mode);
for (let i = 0; i < 360; i++) step(1 / 60);
const faces = ['300 20px Spectral', '400 20px Spectral', 'italic 400 20px Spectral', '400 20px "IBM Plex Sans"', '500 20px "IBM Plex Sans"', '600 20px "IBM Plex Sans"'];
Promise.all(faces.map(f => document.fonts.load(f).catch(() => null))).then(() => { fontsReady++; });
overlay(); fit(); requestAnimationFrame(frame);
})();
</script>
