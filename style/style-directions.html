<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sky and Leaves Styles</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;700;800&family=Spectral:ital,wght@0,300;0,400;1,400&display=swap">
<style>
/* Layout: a compact control bar over one 16:9 stage. The shell stays neutral; each style owns the stage completely. */
:root{
  --bg:#ebebe8; --panel:#f6f6f3; --fg:#1b1c1e; --muted:#5b5e64; --line:#d2d3cf;
  --on:#1b1c1e; --onfg:#f6f6f3; --focus:#2f5bff;
  --ui:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111214; --panel:#1b1c1f; --fg:#ebebe8; --muted:#a2a5ab; --line:#303237; --on:#ebebe8; --onfg:#111214; --focus:#7b9bff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111214; --panel:#1b1c1f; --fg:#ebebe8; --muted:#a2a5ab; --line:#303237; --on:#ebebe8; --onfg:#111214; --focus:#7b9bff; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.shell{max-width:1560px;margin:0 auto;padding-block:14px 20px;display:flex;flex-direction:column;gap:12px}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px}
.brand{font-size:15px;font-weight:600;letter-spacing:.01em;min-width:0}
.brand span{font-weight:400;color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.group{display:flex;flex-wrap:wrap;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.group button,.fs{font:500 14px/1 var(--ui);color:var(--fg);background:transparent;border:0;border-radius:7px;padding:9px 12px;cursor:pointer}
.group button[aria-pressed="true"]{background:var(--on);color:var(--onfg)}
.fs{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px 14px}
button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;margin:0 auto;border-radius:12px;overflow:hidden;background:#000;box-shadow:0 18px 40px -26px rgba(0,0,0,.55)}
.wrap:fullscreen{border-radius:0;width:100vw;height:100vh;max-width:none;aspect-ratio:auto}
.stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0}
#cv{position:absolute;left:0;top:0;width:1600px;height:900px;display:block}
.note{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 24px;font-size:15px;line-height:1.5;color:var(--muted)}
.note p{margin:0;max-width:78ch;min-width:0}
.note b{color:var(--fg);font-weight:600}
.keys{font-size:13px;white-space:nowrap}

/* ---------- slide text, per style ---------- */
.ov{position:absolute;inset:0;pointer-events:none}
.ov>*{position:absolute;margin:0}
.ov .hit{pointer-events:auto}
.ov .h1,.ov .h2{text-wrap:balance}

.t-obs{color:#e9eef7}
.t-obs .kicker{font:500 17px/1 "IBM Plex Mono",ui-monospace,Menlo,monospace;letter-spacing:.34em;text-transform:uppercase;color:#7d93b6}
.t-obs .h1,.t-obs .h2{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-stretch:112%;font-weight:300;letter-spacing:-.012em}
.t-obs .h1{font-size:80px;line-height:1.04}
.t-obs .h1 span{color:#8fa6c8}
.t-obs .h2{font-size:56px;line-height:1.08}
.t-obs .sub{font:400 28px/1.35 Archivo,"Helvetica Neue",Arial,sans-serif;color:#94a8c6}
.t-obs .formula{display:flex;flex-direction:column;align-items:flex-end;gap:8px;font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
.t-obs .formula b{font-weight:400;font-size:40px;color:#e9eef7}
.t-obs .formula span{font-size:19px;color:#7d93b6}
.t-obs .cap{font:400 25px/1.42 Archivo,"Helvetica Neue",Arial,sans-serif;color:#a9b9d2}
.t-obs .seg{display:flex;gap:8px}
.t-obs .seg button{font:500 15px/1 "IBM Plex Mono",ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:#cfdaeb;background:transparent;border:1px solid rgba(190,210,240,.38);border-radius:999px;padding:13px 20px;cursor:pointer}
.t-obs .seg button[aria-pressed="true"]{background:#e9eef7;color:#08101f;border-color:#e9eef7}

.t-plate{color:#1f2a3a}
/* Plate is sized for a lecture hall: on a 13.3-inch slide, titles ≈ 40–50 pt, body ≈ 23 pt, nothing below 18 pt */
.t-plate .kicker{font:600 24px/1 "IBM Plex Sans","Helvetica Neue",Arial,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:#5d6777}
.t-plate .h1,.t-plate .h2{font-family:Spectral,Georgia,serif;font-weight:300;letter-spacing:-.008em}
.t-plate .h1{font-size:84px;line-height:1.08}
.t-plate .h1 i{font-weight:400}
.t-plate .h2{font-size:68px;line-height:1.08}
.t-plate .sub{font:italic 400 40px/1.3 Spectral,Georgia,serif;color:#3f4a5a}
.t-plate .fig{font:italic 400 34px/1.25 Spectral,Georgia,serif;color:#1f2a3a;text-align:center}
.t-plate .fig span{font:400 30px/1.25 "IBM Plex Sans","Helvetica Neue",Arial,sans-serif;color:#3f4a5a;margin-left:12px}
.t-plate .formula{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.t-plate .formula b{font:400 62px/1 Spectral,Georgia,serif}
.t-plate .formula span{font:400 30px/1 "IBM Plex Sans","Helvetica Neue",Arial,sans-serif;color:#3f4a5a}
.t-plate .cap{font:400 38px/1.33 "IBM Plex Sans","Helvetica Neue",Arial,sans-serif;color:#2c3646}
.t-plate .seg{display:flex;border:2px solid #1f2a3a}
.t-plate .seg button{font:500 26px/1 "IBM Plex Sans","Helvetica Neue",Arial,sans-serif;color:#1f2a3a;background:#f2f3ee;border:0;border-left:2px solid #1f2a3a;padding:16px 24px;cursor:pointer}
.t-plate .seg button:first-child{border-left:0}
.t-plate .seg button + button{border-left:2px solid #1f2a3a}
.t-plate .seg button[aria-pressed="true"]{background:#1f2a3a;color:#f2f3ee}

.t-studio{color:#0f1b3d}
.t-studio .kicker{font:700 17px/1 "Plus Jakarta Sans","Helvetica Neue",Arial,sans-serif;color:#33437a;background:#fff;border-radius:999px;padding:12px 20px;box-shadow:0 6px 18px rgba(30,50,110,.12)}
.t-studio .h1,.t-studio .h2{font-family:"Plus Jakarta Sans","Helvetica Neue",Arial,sans-serif;font-weight:800;letter-spacing:-.028em}
.t-studio .h1{font-size:76px;line-height:1.04}
.t-studio .h1 span{color:#55658f}
.t-studio .h2{font-size:54px;line-height:1.08}
.t-studio .sub{font:500 27px/1.4 "Plus Jakarta Sans","Helvetica Neue",Arial,sans-serif;color:#4a5878}
.t-studio .formula{display:flex;flex-direction:column;align-items:flex-end;gap:8px;background:#fff;border-radius:20px;padding:18px 24px;box-sizing:border-box;box-shadow:0 10px 30px rgba(30,50,110,.12)}
.t-studio .formula b{font:800 38px/1 "Plus Jakarta Sans","Helvetica Neue",Arial,sans-serif}
.t-studio .formula span{font:500 17px/1 "Plus Jakarta Sans","Helvetica Neue",Arial,sans-serif;color:#55658f}
.t-studio .cap{font:500 24px/1.45 "Plus Jakarta Sans","Helvetica Neue",Arial,sans-serif;color:#33415f}
.t-studio .seg{display:flex;gap:4px;background:#fff;border-radius:999px;padding:5px;box-shadow:0 8px 24px rgba(30,50,110,.14)}
.t-studio .seg button{font:700 16px/1 "Plus Jakarta Sans","Helvetica Neue",Arial,sans-serif;color:#33437a;background:transparent;border:0;border-radius:999px;padding:13px 20px;cursor:pointer}
.t-studio .seg button[aria-pressed="true"]{background:#0f1b3d;color:#fff}
.ov .seg button:focus-visible{outline:3px solid #2f5bff;outline-offset:3px}
</style>
</head>
<body>

<div class="shell">
  <div class="bar">
    <div class="brand">Sky and leaves <span>· three style directions, same three slides</span></div>
    <div class="controls">
      <div class="group" id="styles" role="group" aria-label="Style">
        <button id="st-obs" data-style="obs" aria-pressed="false">Observatory</button>
        <button id="st-plate" data-style="plate" aria-pressed="true">Plate</button>
        <button id="st-studio" data-style="studio" aria-pressed="false">Studio</button>
      </div>
      <div class="group" id="slides" role="group" aria-label="Slide">
        <button id="sl-0" data-slide="0" aria-pressed="true">1 · Question</button>
        <button id="sl-1" data-slide="1" aria-pressed="false">2 · Light primer</button>
        <button id="sl-2" data-slide="2" aria-pressed="false">3 · Live animation</button>
      </div>
      <button class="fs" id="fs" type="button">Full screen</button>
    </div>
  </div>
  <div class="wrap" id="wrap">
    <div class="stage" id="stage">
      <canvas id="cv" aria-label="Slide illustration"></canvas>
      <div class="ov" id="ov"></div>
    </div>
  </div>
  <div class="note">
    <p id="blurb"></p>
    <p class="keys">← → slides · S style · Space pauses the animation</p>
  </div>
</div>

<script>
(() => {
'use strict';
const W = 1600, H = 900;
const $ = s => document.querySelector(s);
const wrap = $('#wrap'), stage = $('#stage'), cv = $('#cv'), ctx = cv.getContext('2d'), ov = $('#ov');
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
let K = 1, fontsReady = 0, cacheKey = '', paused = false;
const cache = document.createElement('canvas');
const state = { style: 'plate', slide: 0 };

/* ---------------- helpers ---------------- */
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const lin = v => { v /= 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
const enc = v => { v = Math.max(0, Math.min(1, v)); return 255 * (v <= 0.0031308 ? 12.92 * v : 1.055 * Math.pow(v, 1 / 2.4) - 0.055); };
const KEYS = [[380, '#7a00e6'], [400, '#7a00e6'], [430, '#4b00ff'], [450, '#1f2cff'], [470, '#0070ff'], [490, '#00b8ff'], [500, '#00dcd0'], [520, '#00f060'], [550, '#7cf000'], [570, '#e8f000'], [580, '#ffd000'], [600, '#ff8a00'], [620, '#ff4a00'], [650, '#ff1a00'], [700, '#ee0000'], [780, '#cc0000']]
  .map(([l, h]) => [l, [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16))]);
function spec(nm) {
  if (nm <= KEYS[0][0]) return KEYS[0][1];
  for (let i = 1; i < KEYS.length; i++) if (nm <= KEYS[i][0]) { const [l0, c0] = KEYS[i - 1], [l1, c1] = KEYS[i]; const f = (nm - l0) / (l1 - l0); return c0.map((v, k) => v + (c1[k] - v) * f); }
  return KEYS[KEYS.length - 1][1];
}
const vis = nm => Math.max(0, Math.min(1, (nm - 380) / 45, (750 - nm) / 60));
const mixc = (a, b, f) => a.map((v, i) => v + (b[i] - v) * f);
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function circ(c, x, y, r) { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); }
function glow(c, x, y, r, col, a) { const g = c.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, rgba(col, a)); g.addColorStop(1, rgba(col, 0)); c.fillStyle = g; circ(c, x, y, r); c.fill(); }
function txt(c, s, x, y, font, col, align = 'left') { c.font = font; c.fillStyle = col; c.textAlign = align; c.textBaseline = 'alphabetic'; c.fillText(s, x, y); }
const F = {
  mono: (w, s) => `${w} ${s}px "IBM Plex Mono", ui-monospace, Menlo, monospace`,
  arch: (w, s) => `${w} ${s}px Archivo, "Helvetica Neue", Arial, sans-serif`,
  serifI: s => `italic 400 ${s}px Spectral, Georgia, serif`,
  plex: (w, s) => `${w} ${s}px "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif`,
  jak: (w, s) => `${w} ${s}px "Plus Jakarta Sans", "Helvetica Neue", Arial, sans-serif`,
};
const INK = '#1f2a3a', INKS = '#4c5768';
let grainCanvas = null;
function grain(c) {
  if (!grainCanvas) {
    grainCanvas = document.createElement('canvas'); grainCanvas.width = grainCanvas.height = 160;
    const g = grainCanvas.getContext('2d'), id = g.createImageData(160, 160), r = mulberry(7);
    for (let i = 0; i < id.data.length; i += 4) { const v = r(); id.data[i] = id.data[i + 1] = id.data[i + 2] = v < 0.5 ? 20 : 255; id.data[i + 3] = Math.floor(r() * 22); }
    g.putImageData(id, 0, 0);
  }
  return c.createPattern(grainCanvas, 'repeat');
}
function arrow(c, x0, y0, x1, y1, head, col, w) {
  const a = Math.atan2(y1 - y0, x1 - x0);
  c.strokeStyle = col; c.fillStyle = col; c.lineWidth = w; c.lineCap = 'round';
  c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1 - Math.cos(a) * head * 0.6, y1 - Math.sin(a) * head * 0.6); c.stroke();
  c.beginPath(); c.moveTo(x1, y1); c.lineTo(x1 - Math.cos(a - 0.42) * head, y1 - Math.sin(a - 0.42) * head); c.lineTo(x1 - Math.cos(a + 0.42) * head, y1 - Math.sin(a + 0.42) * head); c.closePath(); c.fill();
}

/* ---------------- shared shapes ---------------- */
function leafShape(c, L, Wd) {
  c.beginPath(); c.moveTo(-L / 2, 0);
  c.bezierCurveTo(-L * 0.3, -Wd * 0.95, L * 0.16, -Wd * 0.82, L / 2, 0);
  c.bezierCurveTo(L * 0.16, Wd * 0.82, -L * 0.3, Wd * 0.95, -L / 2, 0); c.closePath();
}
function leafVeins(c, L, Wd, col, w) {
  c.strokeStyle = col; c.lineCap = 'round'; c.lineWidth = w;
  c.beginPath(); c.moveTo(-L / 2, 0); c.quadraticCurveTo(0, -Wd * 0.05, L / 2 - 6, 0); c.stroke();
  c.lineWidth = w * 0.55;
  for (let i = 1; i <= 7; i++) {
    const x = -L / 2 + L * i / 8.4, reach = Wd * 0.7 * Math.sin(Math.PI * Math.min(0.95, i / 8.4 + 0.08));
    for (const s of [-1, 1]) { c.beginPath(); c.moveTo(x, -Wd * 0.03); c.quadraticCurveTo(x + L * 0.05, s * reach * 0.5, x + L * 0.12, s * reach); c.stroke(); }
  }
}
function petiole(c, L, Wd, col, w) { c.strokeStyle = col; c.lineWidth = w; c.lineCap = 'round'; c.beginPath(); c.moveTo(-L / 2, 0); c.quadraticCurveTo(-L / 2 - L * 0.08, Wd * 0.04, -L / 2 - L * 0.15, Wd * 0.14); c.stroke(); }

const STARS = (() => { const r = mulberry(3); return Array.from({ length: 260 }, () => ({ x: r() * W, y: r() * H, s: r() < 0.07 ? 1.7 : 0.6 + r() * 0.7, a: 0.15 + r() * 0.6 })); })();

/* ================= STYLE: Observatory ================= */
function bgObs(c) {
  const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#03060d'); g.addColorStop(1, '#0a1528');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  for (const s of STARS) { c.fillStyle = `rgba(210,225,255,${s.a})`; circ(c, s.x, s.y, s.s); c.fill(); }
}
function spikes(c, x, y, L) {
  c.save(); c.globalCompositeOperation = 'lighter';
  for (const [a, l, w] of [[0, L, 2], [Math.PI / 2, L, 2], [Math.PI / 4, L * 0.42, 1.1], [-Math.PI / 4, L * 0.42, 1.1]]) {
    for (const sg of [1, -1]) {
      const ex = x + Math.cos(a) * l * sg, ey = y + Math.sin(a) * l * sg, g = c.createLinearGradient(x, y, ex, ey);
      g.addColorStop(0, 'rgba(255,246,230,0.9)'); g.addColorStop(1, 'rgba(255,246,230,0)');
      c.strokeStyle = g; c.lineWidth = w; c.beginPath(); c.moveTo(x, y); c.lineTo(ex, ey); c.stroke();
    }
  }
  c.restore();
}
function sunObs(c, x, y, s) {
  c.save(); c.globalCompositeOperation = 'lighter';
  glow(c, x, y, 300 * s, [255, 226, 190], 0.26); glow(c, x, y, 80 * s, [255, 246, 232], 0.85);
  c.restore(); spikes(c, x, y, 230 * s);
  c.fillStyle = '#ffffff'; circ(c, x, y, 9 * s); c.fill();
}
function coverObs(c) {
  bgObs(c);
  // parallel sunlight, very faint
  c.save(); c.globalCompositeOperation = 'lighter';
  const dir = [-0.83, 0.56], perp = [0.56, 0.83];
  for (let i = -3; i <= 3; i++) {
    const ox = 1440 + perp[0] * i * 30, oy = 150 + perp[1] * i * 30, ex = ox + dir[0] * 820, ey = oy + dir[1] * 820;
    const g = c.createLinearGradient(ox, oy, ex, ey); g.addColorStop(0, 'rgba(255,240,220,0)'); g.addColorStop(0.2, 'rgba(255,240,220,0.09)'); g.addColorStop(1, 'rgba(255,240,220,0)');
    c.strokeStyle = g; c.lineWidth = 1.2; c.beginPath(); c.moveTo(ox, oy); c.lineTo(ex, ey); c.stroke();
  }
  c.restore();
  // planet and its thin atmosphere, lit from the upper right
  const cx = 760, cy = 2400, R = 1720;
  const g = c.createRadialGradient(cx + 400, cy - R, 200, cx, cy, R); g.addColorStop(0, '#13305a'); g.addColorStop(0.5, '#0a1a33'); g.addColorStop(1, '#040912');
  c.fillStyle = g; circ(c, cx, cy, R); c.fill();
  // atmosphere ring on its own layer, then faded toward the night side (left)
  const ring = document.createElement('canvas'); ring.width = c.canvas.width; ring.height = c.canvas.height;
  const q = ring.getContext('2d'); q.setTransform(K, 0, 0, K, 0, 0);
  const rg = q.createRadialGradient(cx, cy, R - 3, cx, cy, R + 95);
  rg.addColorStop(0, 'rgba(205,228,255,0.95)'); rg.addColorStop(0.07, 'rgba(140,190,255,0.75)'); rg.addColorStop(0.35, 'rgba(70,130,255,0.28)'); rg.addColorStop(1, 'rgba(30,80,220,0)');
  q.fillStyle = rg; q.beginPath(); q.arc(cx, cy, R + 95, 0, Math.PI * 2); q.arc(cx, cy, R - 3, 0, Math.PI * 2, true); q.fill('evenodd');
  q.globalCompositeOperation = 'destination-in';
  const fade = q.createLinearGradient(-100, 0, 1600, 0); fade.addColorStop(0, 'rgba(0,0,0,0.1)'); fade.addColorStop(0.5, 'rgba(0,0,0,0.35)'); fade.addColorStop(1, 'rgba(0,0,0,1)');
  q.fillStyle = fade; q.fillRect(0, 0, W, H);
  c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.globalCompositeOperation = 'lighter'; c.drawImage(ring, 0, 0); c.restore();
  // backlit leaf
  c.save(); c.translate(1150, 470); c.rotate(-0.42);
  const L = 520, Wd = 200;
  c.save(); c.globalCompositeOperation = 'lighter'; c.shadowColor = 'rgba(130,230,90,0.55)'; c.shadowBlur = 60 * K;
  leafShape(c, L, Wd); c.fillStyle = 'rgba(60,140,40,0.35)'; c.fill(); c.restore();
  petiole(c, L, Wd, '#4f9a3a', 7);
  leafShape(c, L, Wd);
  const lg = c.createRadialGradient(L * 0.12, -Wd * 0.12, 8, 0, 0, L * 0.62);
  lg.addColorStop(0, '#e2ffa8'); lg.addColorStop(0.32, '#97de55'); lg.addColorStop(0.72, '#3f9a2e'); lg.addColorStop(1, '#174f19');
  c.fillStyle = lg; c.fill();
  c.save(); leafShape(c, L, Wd); c.clip(); leafVeins(c, L, Wd, 'rgba(240,255,205,0.6)', 4.5); c.restore();
  leafShape(c, L, Wd); c.strokeStyle = 'rgba(225,255,170,0.85)'; c.lineWidth = 2; c.stroke();
  c.restore();
  sunObs(c, 1440, 150, 1);
}

/* ================= STYLE: Plate ================= */
function bgPlate(c) { c.fillStyle = '#f2f3ee'; c.fillRect(0, 0, W, H); c.fillStyle = grain(c); c.fillRect(0, 0, W, H); }
function leafInk(c, x, y, L, Wd, rot) {
  c.save(); c.translate(x, y); c.rotate(rot);
  const r = mulberry(11);

}
function buildCache(S) {
  cache.width = cv.width; cache.height = cv.height;
  const c = cache.getContext('2d'); c.setTransform(K, 0, 0, K, 0, 0); c.clearRect(0, 0, W, H);
  if (state.slide === 0) S.cover(c); else if (state.slide === 1) primerStatic(c, S); else simStatic(c, S);
}
let last = performance.now(), T = 0;
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  const S = STY[state.style];
  const key = state.style + state.slide + ':' + cv.width + 'x' + cv.height + ':' + fontsReady;
  if (key !== cacheKey) { buildCache(S); cacheKey = key; }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height); ctx.drawImage(cache, 0, 0);
  ctx.setTransform(K, 0, 0, K, 0, 0);
  if (state.slide === 1) { if (!RM) T += dt; primerDyn(ctx, S, T); }
  else if (state.slide === 2) { if (!paused) { step(dt); T += dt; } simDraw(ctx, S, T); }
  requestAnimationFrame(frame);
}

/* ================= events ================= */
function setStyle(s) { state.style = s; cacheKey = ''; overlay(); }
function setSlide(i) { state.slide = (i + 3) % 3; cacheKey = ''; overlay(); }
$('#styles').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setStyle(b.dataset.style); });
$('#slides').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setSlide(+b.dataset.slide); });
ov.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.mode) { sim.mode = b.dataset.mode; }
  else if (b.dataset.act === 'pause') { paused = !paused; }
  overlay(); const again = document.getElementById(b.id); if (again) again.focus();
});
$('#fs').addEventListener('click', () => {
  if (document.fullscreenElement) { document.exitFullscreen().catch(() => {}); return; }
  if (wrap.requestFullscreen) wrap.requestFullscreen().catch(() => {});
});
document.addEventListener('fullscreenchange', resize);
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input,textarea')) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { setSlide(state.slide + 1); e.preventDefault(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { setSlide(state.slide - 1); e.preventDefault(); }
  else if (e.key === 's' || e.key === 'S') setStyle(ORDER[(ORDER.indexOf(state.style) + 1) % 3]);
  else if (e.key === ' ' && state.slide === 2) { paused = !paused; overlay(); e.preventDefault(); }
});
new ResizeObserver(resize).observe(document.body);
addEventListener('resize', resize);

// deep link: #obs, #plate2, #studio3 ...
const m = /^#(obs|plate|studio)([123])?(s)?$/.exec(location.hash);
if (m) { state.style = m[1]; if (m[2]) state.slide = +m[2] - 1; if (m[3]) { sim.mode = 'sunset'; sim.mm = 1; } }
initAcc();
for (let i = 0; i < 360; i++) step(1 / 60);
const faces = ['500 20px "IBM Plex Mono"', '400 20px "IBM Plex Mono"', '300 20px Archivo', '400 20px Archivo', 'italic 400 20px Spectral', '300 20px Spectral', '400 20px "IBM Plex Sans"', '600 20px "IBM Plex Sans"', '500 20px "Plus Jakarta Sans"', '700 20px "Plus Jakarta Sans"', '800 20px "Plus Jakarta Sans"'];
Promise.all(faces.map(f => document.fonts.load(f).catch(() => null))).then(() => { fontsReady++; });
document.fonts.ready.then(() => { fontsReady++; });
overlay(); resize(); requestAnimationFrame(frame);
})();
</script>
